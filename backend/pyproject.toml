[project]
name = "heretic-scalpel-forge"
version = "0.2.0"
description = "Heretic-Scalpel Swarm Forge: tri-tier MoE (macro core / micro expert) training + datagen core library"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "torch>=2.14",
    "transformers>=5.18",
    "safetensors>=0.4",
    "accelerate>=1.15",
    "huggingface-hub>=1.33",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.scripts]
forge = "forge_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_core"]

[tool.uv]
# 复用已有 .venv，避免重装 torch/CUDA 轮子
package = true
